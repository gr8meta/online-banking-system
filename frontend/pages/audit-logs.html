<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit Logs - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-shaded text-warning me-2"></i>SecureBank Admin Portal</a>
        <div class="ms-auto"><a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
    </nav>

    <div class="container-fluid my-4 px-4">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="bi bi-journal-text text-primary me-2"></i>System Security & Audit Trail</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Log ID</th>
                            <th>Action</th>
                            <th>Description</th>
                            <th>Origin IP</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logTable">
                        <tr><td colspan="5" class="text-center py-3">Loading security audit records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_ADMIN");

        async function loadLogs() {
            try {
                const list = await api.request("/admin/audit-logs");
                const tbody = document.getElementById("logTable");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-3">No audit records found.</td></tr>`;
                    return;
                }
                list.forEach(l => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${l.logId}</td>
                            <td><span class="badge bg-dark">${l.action}</span></td>
                            <td>${l.description}</td>
                            <td><code>${l.ipAddress || '127.0.0.1'}</code></td>
                            <td>${new Date(l.createdAt).toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }
        loadLogs();
    </script>
</body>
</html>
