<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report & Block Transaction - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card p-4 shadow">
            <h4 class="fw-bold text-danger mb-2"><i class="bi bi-shield-exclamation me-2"></i>Fraud Protection: Block Transaction</h4>
            <p class="text-muted small">Report suspicious transactions immediately to initiate a security lock and investigation.</p>

            <div id="alertMsg" class="alert d-none"></div>

            <form id="blockForm">
                <div class="mb-3">
                    <label class="form-label">Transaction ID *</label>
                    <input type="number" id="txId" class="form-control" placeholder="Enter Transaction ID (e.g. 1)" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Reason for Blocking / Fraud Details *</label>
                    <textarea id="reason" class="form-control" rows="3" placeholder="Explain why this transaction is suspicious..." required></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Submit Emergency Block Request</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        document.getElementById("blockForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const payload = {
                transactionId: parseInt(document.getElementById("txId").value),
                reason: document.getElementById("reason").value.trim()
            };
            try {
                const res = await api.request("/transaction-block-requests", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerText = "Block request registered! Admin notified for review.";
                    alertDiv.classList.remove("d-none");
                    document.getElementById("blockForm").reset();
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = res.message || "Failed to submit request.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Server error occurred.";
                alertDiv.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
