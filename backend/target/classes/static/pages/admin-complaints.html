<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complaint Management - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-shaded text-warning me-2"></i>SecureBank Admin Portal</a>
        <div class="ms-auto"><a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
    </nav>

    <div class="container-fluid my-4 px-4">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="bi bi-headset text-primary me-2"></i>Customer Grievances & Resolution</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Subject & Description</th>
                            <th>Status</th>
                            <th>Admin Response</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="compTable">
                        <tr><td colspan="6" class="text-center py-3">Loading grievances...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_ADMIN");

        async function loadComplaints() {
            try {
                const list = await api.request("/admin/complaints");
                const tbody = document.getElementById("compTable");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3">No complaints filed.</td></tr>`;
                    return;
                }
                list.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${c.complaintId}</td>
                            <td>${c.customer ? c.customer.fullName : 'N/A'}<br><small class="text-muted">${c.customer ? c.customer.email : ''}</small></td>
                            <td><strong>${c.subject}</strong><br><small>${c.description}</small></td>
                            <td><span class="badge ${c.status === 'RESOLVED' ? 'bg-success' : 'bg-warning text-dark'}">${c.status}</span></td>
                            <td><small>${c.adminResponse || '<em>Pending</em>'}</small></td>
                            <td>
                                <button onclick="respond(${c.complaintId})" class="btn btn-sm btn-primary">Respond</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function respond(id) {
            const resp = prompt("Enter administrative resolution message:");
            if (resp) {
                await api.request(`/admin/complaints/${id}/respond`, {
                    method: "PUT",
                    body: JSON.stringify({
                        adminResponse: resp,
                        status: "RESOLVED"
                    })
                });
                loadComplaints();
            }
        }
        loadComplaints();
    </script>
</body>
</html>
