<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal Login - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5 bg-dark">
    <div class="card p-4 shadow" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-warning display-4"></i>
            <h3 class="fw-bold mt-2">Bank Administration</h3>
            <p class="text-muted small">Authorized bank administrative staff only</p>
        </div>

        <div id="alertMsg" class="alert d-none"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="admin" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Security Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Admin password" required>
                </div>
            </div>
            <button type="submit" id="btnSubmit" class="btn btn-warning w-100 py-2 fw-bold text-dark">Authenticate Admin</button>
        </form>

        <div class="text-center mt-3">
            <a href="login.html" class="text-decoration-none text-muted small">&larr; Return to Customer Login</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");
            const alertDiv = document.getElementById("alertMsg");
            btn.disabled = true;

            try {
                const res = await fetch("http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await res.json();
                if (res.ok && data.role === "ROLE_ADMIN") {
                    api.setAuth(data);
                    window.location.href = "admin-dashboard.html";
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = "Invalid credentials or unauthorized role.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Admin server connection error.";
                alertDiv.classList.remove("d-none");
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
