<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="card p-4 shadow" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-bank2 text-primary display-4"></i>
            <h3 class="fw-bold mt-2">Customer Login</h3>
            <p class="text-muted small">Sign in to manage your bank account</p>
        </div>

        <div id="alertMsg" class="alert d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted mb-1">Don't have an account? <a href="register.html" class="fw-bold text-decoration-none">Register here</a></p>
            <p class="small text-muted"><a href="admin-login.html" class="text-secondary text-decoration-none">Admin Login</a></p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const alertDiv = document.getElementById("alertMsg");
            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                const res = await fetch("http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    api.setAuth(data);
                    if (data.role === "ROLE_ADMIN") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "customer-dashboard.html";
                    }
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = data.message || "Invalid credentials or account locked.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Server connection error.";
                alertDiv.classList.remove("d-none");
            } finally {
                btn.disabled = false;
                btn.innerText = "Login";
            }
        });
    </script>
</body>
</html>
