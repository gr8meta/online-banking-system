<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Profile - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card p-4 shadow">
            <h4 class="fw-bold mb-3"><i class="bi bi-person-circle text-primary me-2"></i>My Profile</h4>
            <div id="alertMsg" class="alert d-none"></div>

            <form id="profileForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email (Read Only)</label>
                        <input type="email" id="email" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile (Read Only)</label>
                        <input type="text" id="mobile" class="form-control bg-light" readonly>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea id="address" class="form-control" rows="2" required></textarea>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input type="text" id="city" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <input type="text" id="state" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">PIN Code</label>
                        <input type="text" id="pin" class="form-control" pattern="[0-9]{6}" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Profile</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        async function loadProfile() {
            try {
                const c = await api.request("/customer/profile");
                if (c) {
                    document.getElementById("name").value = c.fullName;
                    document.getElementById("email").value = c.email;
                    document.getElementById("mobile").value = c.mobile;
                    document.getElementById("address").value = c.address;
                    document.getElementById("city").value = c.city;
                    document.getElementById("state").value = c.state;
                    document.getElementById("pin").value = c.pinCode;
                }
            } catch (err) { console.error(err); }
        }

        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const payload = {
                fullName: document.getElementById("name").value.trim(),
                address: document.getElementById("address").value.trim(),
                city: document.getElementById("city").value.trim(),
                state: document.getElementById("state").value.trim(),
                pinCode: document.getElementById("pin").value.trim()
            };
            try {
                const res = await api.request("/customer/profile", {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerText = "Profile updated successfully!";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Update failed.";
                alertDiv.classList.remove("d-none");
            }
        });

        loadProfile();
    </script>
</body>
</html>
