<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Support & Complaints - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="card p-4 shadow">
                    <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Register Complaint</h5>
                    <div id="alertMsg" class="alert d-none"></div>

                    <form id="compForm">
                        <div class="mb-3">
                            <label class="form-label">Subject *</label>
                            <input type="text" id="subject" class="form-control" required placeholder="e.g. Transfer deduction issue">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Transaction ID (Optional)</label>
                            <input type="number" id="txId" class="form-control" placeholder="10">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Description / Grievance *</label>
                            <textarea id="desc" class="form-control" rows="4" required placeholder="Explain the problem in detail..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Grievance</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 shadow">
                    <h5 class="fw-bold mb-3"><i class="bi bi-card-checklist text-primary me-2"></i>Complaint History</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Subject</th>
                                    <th>Status</th>
                                    <th>Admin Response</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="compTableBody">
                                <tr><td colspan="4" class="text-center py-3">Loading grievances...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        async function loadComplaints() {
            try {
                const list = await api.request("/complaints");
                const tbody = document.getElementById("compTableBody");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">No complaints filed yet.</td></tr>`;
                    return;
                }
                list.forEach(c => {
                    const badge = c.status === 'RESOLVED' ? 'bg-success' : (c.status === 'OPEN' ? 'bg-warning text-dark' : 'bg-secondary');
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${c.subject}</strong><br><small class="text-muted">${c.description}</small></td>
                            <td><span class="badge ${badge}">${c.status}</span></td>
                            <td><small>${c.adminResponse || '<em>Pending review</em>'}</small></td>
                            <td><small>${new Date(c.createdAt).toLocaleDateString()}</small></td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById("compForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const txVal = document.getElementById("txId").value;
            const payload = {
                subject: document.getElementById("subject").value.trim(),
                transactionId: txVal ? parseInt(txVal) : null,
                description: document.getElementById("desc").value.trim()
            };
            try {
                const res = await api.request("/complaints", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerText = "Complaint submitted successfully!";
                    alertDiv.classList.remove("d-none");
                    document.getElementById("compForm").reset();
                    loadComplaints();
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = res.message || "Failed to submit.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Submission error.";
                alertDiv.classList.remove("d-none");
            }
        });

        loadComplaints();
    </script>
</body>
</html>
