# Application
spring.application.name=online-banking-system
server.port=8080

# Database Configuration (PostgreSQL)
# NOTE: the database itself must already exist - Postgres has no equivalent
# of MySQL's createDatabaseIfNotExist=true. Create it once with:
#   CREATE DATABASE online_banking_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/online_banking_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0555}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Security Rules
app.security.max-failed-attempts=3  