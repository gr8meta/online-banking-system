<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Management - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-shaded text-warning me-2"></i>SecureBank Admin Portal</a>
        <div class="ms-auto"><a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
    </nav>

    <div class="container-fluid my-4 px-4">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="bi bi-people-fill text-primary me-2"></i>Bank Customer Directory</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>City & State</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="custTable">
                        <tr><td colspan="7" class="text-center py-3">Loading customer records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_ADMIN");

        async function loadCustomers() {
            try {
                const list = await api.request("/admin/customers");
                const tbody = document.getElementById("custTable");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-3">No customers registered.</td></tr>`;
                    return;
                }
                list.forEach(c => {
                    const isBlocked = c.status === 'BLOCKED';
                    tbody.innerHTML += `
                        <tr>
                            <td>#${c.customerId}</td>
                            <td><strong>${c.fullName}</strong></td>
                            <td>${c.email}</td>
                            <td>${c.mobile}</td>
                            <td>${c.city}, ${c.state}</td>
                            <td><span class="badge ${c.status === 'ACTIVE' ? 'bg-success' : 'bg-danger'}">${c.status}</span></td>
                            <td>
                                <button onclick="toggleStatus(${c.customerId}, '${isBlocked ? 'ACTIVE' : 'BLOCKED'}')" 
                                    class="btn btn-sm ${isBlocked ? 'btn-success' : 'btn-outline-danger'}">
                                    ${isBlocked ? '<i class="bi bi-unlock me-1"></i> Activate' : '<i class="bi bi-lock me-1"></i> Block'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function toggleStatus(id, newStatus) {
            if (confirm(`Change customer status to ${newStatus}?`)) {
                await api.request(`/admin/customers/${id}/status?status=${newStatus}`, { method: "PUT" });
                loadCustomers();
            }
        }

        loadCustomers();
    </script>
</body>
</html>
