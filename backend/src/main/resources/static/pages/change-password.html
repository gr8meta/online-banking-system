<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 480px;">
        <div class="card p-4 shadow">
            <h4 class="fw-bold mb-3"><i class="bi bi-key text-primary me-2"></i>Change Password</h4>
            <div id="alertMsg" class="alert d-none"></div>

            <form id="pwdForm">
                <div class="mb-3">
                    <label class="form-label">Current Password *</label>
                    <input type="password" id="oldPwd" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password * (Min 6 chars)</label>
                    <input type="password" id="newPwd" minlength="6" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password *</label>
                    <input type="password" id="confPwd" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Password</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        document.getElementById("pwdForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const newP = document.getElementById("newPwd").value;
            const confP = document.getElementById("confPwd").value;

            if (newP !== confP) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "New passwords do not match.";
                alertDiv.classList.remove("d-none");
                return;
            }

            try {
                const res = await api.request("/customer/change-password", {
                    method: "POST",
                    body: JSON.stringify({
                        oldPassword: document.getElementById("oldPwd").value,
                        newPassword: newP
                    })
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerText = "Password changed successfully! You may login again.";
                    alertDiv.classList.remove("d-none");
                    document.getElementById("pwdForm").reset();
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = res.message || "Failed to update password.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Error changing password.";
                alertDiv.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
