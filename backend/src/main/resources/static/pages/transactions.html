<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction History - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card p-4 shadow">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-receipt text-primary me-2"></i>Account Statement & Transaction History</h4>
                <button onclick="window.print()" class="btn btn-outline-secondary btn-sm"><i class="bi bi-printer me-1"></i> Print / Download PDF</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tx ID</th>
                            <th>Reference ID</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Sender A/C</th>
                            <th>Receiver A/C</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="statementTable">
                        <tr><td colspan="9" class="text-center py-3">Loading transaction records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        async function loadStatement() {
            const accId = localStorage.getItem("primaryAccountId");
            if (!accId) return;
            try {
                const list = await api.request(`/accounts/${accId}/transactions`);
                const tbody = document.getElementById("statementTable");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-3">No transactions found.</td></tr>`;
                    return;
                }
                list.forEach(tx => {
                    const badge = tx.status === 'SUCCESS' ? 'bg-success' : 'bg-danger';
                    tbody.innerHTML += `
                        <tr>
                            <td>#${tx.transactionId}</td>
                            <td><code>${tx.referenceId}</code></td>
                            <td><span class="badge bg-secondary">${tx.type}</span></td>
                            <td class="fw-bold">₹ ${Number(tx.amount).toFixed(2)}</td>
                            <td>${tx.senderAccountNumber}</td>
                            <td>${tx.receiverAccountNumber}</td>
                            <td>${tx.description}</td>
                            <td><span class="badge ${badge}">${tx.status}</span></td>
                            <td>${new Date(tx.date).toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }
        loadStatement();
    </script>
</body>
</html>
