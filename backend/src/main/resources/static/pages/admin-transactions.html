<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Monitoring - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-shaded text-warning me-2"></i>SecureBank Admin Portal</a>
        <div class="ms-auto"><a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
    </nav>

    <div class="container-fluid my-4 px-4">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3"><i class="bi bi-receipt text-primary me-2"></i>Real-Time Transaction Monitor</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tx ID</th>
                            <th>Reference ID</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date & Time</th>
                            <th>Admin Control</th>
                        </tr>
                    </thead>
                    <tbody id="txTable">
                        <tr><td colspan="8" class="text-center py-3">Loading transaction data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_ADMIN");

        async function loadTx() {
            try {
                const list = await api.request("/admin/transactions");
                const tbody = document.getElementById("txTable");
                tbody.innerHTML = "";
                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-3">No transactions found.</td></tr>`;
                    return;
                }
                list.forEach(tx => {
                    const isBlocked = tx.status === 'BLOCKED';
                    tbody.innerHTML += `
                        <tr>
                            <td>#${tx.transactionId}</td>
                            <td><code>${tx.referenceId}</code></td>
                            <td><span class="badge bg-secondary">${tx.transactionType}</span></td>
                            <td class="fw-bold">₹ ${Number(tx.amount).toFixed(2)}</td>
                            <td>${tx.description}</td>
                            <td><span class="badge ${tx.status === 'SUCCESS' ? 'bg-success' : 'bg-danger'}">${tx.status}</span></td>
                            <td>${new Date(tx.transactionDate).toLocaleString()}</td>
                            <td>
                                <button onclick="setTxStatus(${tx.transactionId}, '${isBlocked ? 'SUCCESS' : 'BLOCKED'}')" 
                                    class="btn btn-sm ${isBlocked ? 'btn-success' : 'btn-outline-danger'}">
                                    ${isBlocked ? 'Unblock' : 'Block Tx'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function setTxStatus(id, st) {
            if (confirm(`Change transaction status to ${st}?`)) {
                await api.request(`/admin/transactions/${id}/status?status=${st}`, { method: "PUT" });
                loadTx();
            }
        }
        loadTx();
    </script>
</body>
</html>
