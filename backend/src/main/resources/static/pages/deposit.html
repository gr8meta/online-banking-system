<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deposit Funds - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 500px;">
        <div class="card p-4 shadow">
            <h4 class="fw-bold mb-3"><i class="bi bi-plus-circle text-success me-2"></i>Deposit Money</h4>
            <div id="alertMsg" class="alert d-none"></div>

            <form id="depForm">
                <div class="mb-3">
                    <label class="form-label">Deposit Amount (₹) *</label>
                    <input type="number" step="0.01" min="1" id="amount" class="form-control" placeholder="1000.00" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Description / Source</label>
                    <input type="text" id="desc" class="form-control" placeholder="Salary credit, Cash deposit">
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-success w-100 py-2 fw-semibold">Deposit Now</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        document.getElementById("depForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const btn = document.getElementById("btnSubmit");
            const senderAccId = localStorage.getItem("primaryAccountId");

            btn.disabled = true;
            try {
                const res = await api.request("/accounts/deposit", {
                    method: "POST",
                    body: JSON.stringify({
                        accountId: parseInt(senderAccId),
                        amount: parseFloat(document.getElementById("amount").value),
                        description: document.getElementById("desc").value.trim()
                    })
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerText = "Deposit successful! Balance updated.";
                    alertDiv.classList.remove("d-none");
                    document.getElementById("depForm").reset();
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = res.message || "Failed to deposit.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "An error occurred.";
                alertDiv.classList.remove("d-none");
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
