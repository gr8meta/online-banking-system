<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fund Transfer - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-bank2 me-2"></i>SecureBank</a>
            <div class="ms-auto"><a href="customer-dashboard.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a></div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <div class="card p-4 shadow">
            <h4 class="fw-bold mb-3"><i class="bi bi-send text-primary me-2"></i>Direct Fund Transfer</h4>
            <p class="text-muted small">Transfer money securely between bank accounts with instant settlement.</p>

            <div id="alertMsg" class="alert d-none"></div>

            <form id="transferForm">
                <div class="mb-3">
                    <label class="form-label">Beneficiary / Destination Account Number *</label>
                    <input type="text" id="targetAcc" class="form-control" placeholder="Enter 10-digit Account Number" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Transfer Amount (₹) *</label>
                    <input type="number" step="0.01" min="1" id="amount" class="form-control" placeholder="500.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Remark / Description</label>
                    <input type="text" id="description" class="form-control" placeholder="e.g. Rent, Freelance Payment">
                </div>
                <div class="mb-4">
                    <label class="form-label">Transaction Security PIN / Password *</label>
                    <input type="password" id="pin" class="form-control" placeholder="Enter verification code" required>
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-semibold">Authorize & Transfer Money</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        checkAuth("ROLE_CUSTOMER");

        document.getElementById("transferForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertDiv = document.getElementById("alertMsg");
            const btn = document.getElementById("btnSubmit");
            const senderAccId = localStorage.getItem("primaryAccountId");

            if (!senderAccId) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Error: Account not found in session.";
                alertDiv.classList.remove("d-none");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing Transfer...";

            const payload = {
                senderAccountId: parseInt(senderAccId),
                beneficiaryAccountNumber: document.getElementById("targetAcc").value.trim(),
                amount: parseFloat(document.getElementById("amount").value),
                description: document.getElementById("description").value.trim(),
                transactionPin: document.getElementById("pin").value
            };

            try {
                const res = await api.request("/transfers", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                if (res && res.success) {
                    alertDiv.className = "alert alert-success";
                    alertDiv.innerHTML = `<strong>Transfer Successful!</strong> Reference: ${res.data.referenceId}`;
                    alertDiv.classList.remove("d-none");
                    document.getElementById("transferForm").reset();
                } else {
                    alertDiv.className = "alert alert-danger";
                    alertDiv.innerText = res.message || "Transfer failed.";
                    alertDiv.classList.remove("d-none");
                }
            } catch (err) {
                alertDiv.className = "alert alert-danger";
                alertDiv.innerText = "Transaction error occurred.";
                alertDiv.classList.remove("d-none");
            } finally {
                btn.disabled = false;
                btn.innerText = "Authorize & Transfer Money";
            }
        });
    </script>
</body>
</html>
